# Couchbase Server local para desarrollo (en producción se usa Couchbase Capella).
#
#   docker compose up -d
#   Abrir http://localhost:8091, crear el clúster (usuario Administrator),
#   activar los servicios Data, Index y Query y crear el bucket "smartinventory".
#   Luego, en backend/.env:
#     COUCHBASE_CONNECTION_STRING=couchbase://localhost
#     COUCHBASE_USERNAME=Administrator
#     COUCHBASE_PASSWORD=<la contraseña que elegiste>
#   y ejecutar: npm run db:init && npm run seed
services:
  couchbase:
    image: couchbase/server:community-7.6.2
    container_name: smartinventory-couchbase
    restart: unless-stopped
    ports:
      - "8091-8097:8091-8097" # Consola web y servicios (Query, Index...)
      - "11210:11210"         # Acceso clave-valor del SDK
    volumes:
      - couchbase_data:/opt/couchbase/var

volumes:
  couchbase_data:
